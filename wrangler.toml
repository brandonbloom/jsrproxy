name = "jsrproxy"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# Configure production bindings before deployment. The initial implementation
# keeps all registry semantics behind testable storage-independent interfaces.
[[durable_objects.bindings]]
name = "ADMISSION"
class_name = "AdmissionDurableObjectV2"

[[durable_objects.bindings]]
name = "PACKAGES"
class_name = "PackageDurableObjectV2"

# Kept unreferenced by Worker code during the v3-to-v4 transition so
# Cloudflare can retire the old namespaces in v4.
[[durable_objects.bindings]]
name = "ADMISSION_LEGACY"
class_name = "AdmissionDurableObject"

[[durable_objects.bindings]]
name = "PACKAGES_LEGACY"
class_name = "PackageDurableObject"

[[durable_objects.bindings]]
name = "MATERIALIZER"
class_name = "MaterializerContainer"

[[containers]]
class_name = "MaterializerContainer"
image = "./materializer/Dockerfile"
image_build_context = "."
instance_type = "basic"
max_instances = 4

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "jsrproxy-artifacts"
preview_bucket_name = "jsrproxy-artifacts-preview"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdmissionDurableObject", "PackageDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MaterializerContainer"]

# Staging has no durable state to preserve. Recreate these namespaces so the
# The active bindings move to fresh SQLite-only namespaces. The unused legacy
# bindings remain for one deployment; v4 removes them and retires their data.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["AdmissionDurableObjectV2", "PackageDurableObjectV2"]

[env.staging]
workers_dev = true

[env.staging.vars]
JSRPROXY_CONFIG = '{"trusted_github_users":["brandonbloom"],"scopes":{"brandonbloom":{"type":"github","owner":"brandonbloom"},"crudetc":{"type":"github","owner":"crudetc"}}}'

[[env.staging.durable_objects.bindings]]
name = "ADMISSION"
class_name = "AdmissionDurableObjectV2"

[[env.staging.durable_objects.bindings]]
name = "PACKAGES"
class_name = "PackageDurableObjectV2"

[[env.staging.durable_objects.bindings]]
name = "ADMISSION_LEGACY"
class_name = "AdmissionDurableObject"

[[env.staging.durable_objects.bindings]]
name = "PACKAGES_LEGACY"
class_name = "PackageDurableObject"

[[env.staging.durable_objects.bindings]]
name = "MATERIALIZER"
class_name = "MaterializerContainer"

[[env.staging.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "jsrproxy-artifacts-preview"

[[env.staging.containers]]
class_name = "MaterializerContainer"
image = "./materializer/Dockerfile"
image_build_context = "."
instance_type = "basic"
max_instances = 4
