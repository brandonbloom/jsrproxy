name = "jsrproxy"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# Configure production bindings before deployment. The initial implementation
# keeps all registry semantics behind testable storage-independent interfaces.
[[durable_objects.bindings]]
name = "ADMISSION"
class_name = "AdmissionDurableObjectV2"

[[durable_objects.bindings]]
name = "PACKAGES"
class_name = "PackageDurableObjectV2"

[[durable_objects.bindings]]
name = "MATERIALIZER"
class_name = "MaterializerContainer"

[[containers]]
class_name = "MaterializerContainer"
image = "./materializer/Dockerfile"
image_build_context = "."
instance_type = "basic"
max_instances = 4

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "jsrproxy-artifacts"
preview_bucket_name = "jsrproxy-artifacts-preview"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdmissionDurableObject", "PackageDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MaterializerContainer"]

# Staging has no durable state to preserve. Recreate these namespaces so the
# SQLite-only implementation begins with no prior package or admission records.
# The old classes stay exported without bindings only long enough for this
# deployment's deletion migration to retire their namespaces.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["AdmissionDurableObjectV2", "PackageDurableObjectV2"]
deleted_classes = ["AdmissionDurableObject", "PackageDurableObject"]

[env.staging]
workers_dev = true

[env.staging.vars]
JSRPROXY_CONFIG = '{"trusted_github_users":["brandonbloom"],"scopes":{"brandonbloom":{"type":"github","owner":"brandonbloom"},"crudetc":{"type":"github","owner":"crudetc"}}}'

[[env.staging.durable_objects.bindings]]
name = "ADMISSION"
class_name = "AdmissionDurableObjectV2"

[[env.staging.durable_objects.bindings]]
name = "PACKAGES"
class_name = "PackageDurableObjectV2"

[[env.staging.durable_objects.bindings]]
name = "MATERIALIZER"
class_name = "MaterializerContainer"

[[env.staging.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "jsrproxy-artifacts-preview"

[[env.staging.containers]]
class_name = "MaterializerContainer"
image = "./materializer/Dockerfile"
image_build_context = "."
instance_type = "basic"
max_instances = 4
